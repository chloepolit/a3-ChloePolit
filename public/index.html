<!doctype html>
<html lang='en'>
  <head>
    <title>CS 4241 A3</title>
    <meta charset='utf-8'>
    <script src='js/main.js'></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo='>
    <meta name="description" content="Add a new task to the to-do list.">
  </head>


  <body>
    <main>
    <button id="logout-btn" class="button">Log Out</button>
    <script src="js/authenticate.js"></script>
    <h1>Add a Task</h1>
    <p>
        <label for="task">Task:</label>
        <input type="text" id="task" name="user_name">
    </p>
    <p>
        <label for="deadline">Deadline:</label>
        <input type="datetime-local" 
        id="deadline" 
        name="deadline"
        min="2026-09-04T00:00"
        max="2026-12-31T23:59">
    </p>
    <p>
        <label for="creation-date">Creation Date:</label>
        <input type="datetime-local" 
        id="creation-date" 
        name="creation-date"
        min="2026-09-04T00:00"
        max="2026-12-31T23:59">
    </p>
    <p>
        <label for="category">Choose a category:</label>
        <select id="category" name="category">
            <option value="classes">Classes</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
        </select>
    </p>
    <p>
        <span>Recurring task?</span>
        <label><input type="radio" name="recurring" value="yes"> Yes</label>
        <label><input type="radio" name="recurring" value="no" checked> No</label>
    </p>
    <button type="submit" class="button">Add</button>
    
    </form>
    <a href="/list.html" class="button">View Current Tasks</a>
    </main>
  </body>
</html>
